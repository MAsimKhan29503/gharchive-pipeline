version: 2

models:
  - name: dim_repo
    columns:
      - name: repo_id
        data_tests: [not_null, unique]
      - name: repo_name
        data_tests: [not_null]

  - name: dim_actor
    columns:
      - name: actor_id
        data_tests: [not_null, unique]
      - name: is_bot
        data_tests: [not_null]

  - name: fct_events
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: repo_id
        data_tests:
          - relationships:
              to: ref('dim_repo')
              field: repo_id
      - name: actor_id
        data_tests:
          - relationships:
              to: ref('dim_actor')
              field: actor_id