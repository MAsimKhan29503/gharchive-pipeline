name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WH_HOST: localhost
      WH_PORT: "5432"
      WH_USER: warehouse
      WH_PASSWORD: warehouse
      WH_DB: warehouse
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      PGPASSWORD: warehouse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core==1.8.9 dbt-postgres==1.8.2

      - name: Check DAG files for syntax errors
        run: python -m py_compile dags/*.py

      - name: Create raw table
        run: psql -h localhost -U warehouse -d warehouse -f init/01_raw_schema.sql

      - name: Load sample events
        run: psql -h localhost -U warehouse -d warehouse -f ci/seed.sql

      - name: dbt build
        working-directory: dbt
        run: dbt build